# Ruff configuration for VibeCheck backend.
#
# Project hard constraints require broad exception handling that maps
# all errors to fixed reason_code values (never leaking raw exceptions).
# FastAPI's default-argument pattern (File, Header, Form) is also expected.

target-version = "py312"
line-length = 100

[lint]
# Rules that conflict with project hard constraints or framework conventions:
# - BLE001:   Intentional broad exception catches, mapped to fixed error_code
# - S110:     Intentional try-except-pass for DB rollback/cleanup
# - B008:     FastAPI requires File/Header/Form in argument defaults
# - ASYNC230: File I/O in async functions (upload/github), low concurrency
# - SIM115:   tarfile.open without context manager, safe in controlled scope
# - UP017:    datetime.UTC not available in all runtime environments
ignore = [
    "BLE001",
    "S110",
    "B008",
    "ASYNC230",
    "SIM115",
    "UP017",
    # --- test-specific (acceptable in test code) ---
    "SIM117",   # nested with → combined with (readability trade-off in mocks)
    "C408",     # dict() → {} (readability trade-off in test fixtures)
    "RUF059",   # unused unpacked variable (test assertions on specific fields)
    "PERF402",  # manual list copy (minor perf in test helpers)
    "SIM118",   # in dict.keys() (readability in test assertions)
    "RUF012",   # mutable class default (test parametrize lists)
]

[lint.per-file-ignores]
# These test modules intentionally star-import the repair policy module
# under test to exercise its public surface; F403/F405 are expected here
# and acceptable for test fixtures.
"tests/test_repair_adversarial.py" = ["F403", "F405"]
"tests/test_repair_boundaries.py" = ["F403", "F405"]
"tests/test_repair_engine.py" = ["F403", "F405"]
