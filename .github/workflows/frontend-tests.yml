name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Reject high or critical dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check production source boundaries
        working-directory: frontend
        run: npm run check:test-hooks

      - name: Run unit tests with configured API URL
        working-directory: frontend
        run: npm run test:unit

      - name: Run unit tests without configured API URL
        working-directory: frontend
        run: env -u NEXT_PUBLIC_API_BASE_URL npm run test:unit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Run development Strict Mode tests
        working-directory: frontend
        run: npm run test:e2e:dev

      - name: Verify dev E2E lifecycle (POSIX SIGTERM process group cleanup)
        working-directory: frontend
        run: |
          # Start dev E2E in background, send SIGTERM during Playwright phase,
          # then verify exit code 143 and port 3001 release.
          set -m  # enable job control for process groups
          npm run test:e2e:dev -- --grep "__NO_MATCHING_TEST__" --reporter=line &
          CHILD_PID=$!
          sleep 30
          kill -TERM -$CHILD_PID 2>/dev/null || kill -TERM $CHILD_PID 2>/dev/null || true
          wait $CHILD_PID
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          # Verify port 3001 is free
          if ss -tlnp | grep ":3001 "; then
            echo "FAIL: port 3001 still in use after SIGTERM"
            exit 1
          fi
          # Verify no orphaned Next.js or Node processes
          if pgrep -f "next dev" | grep -v $$; then
            echo "FAIL: orphaned next dev process found"
            pkill -f "next dev" || true
            exit 1
          fi
          echo "POSIX process group cleanup verified"
