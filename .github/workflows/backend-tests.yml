name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibecheck
          POSTGRES_PASSWORD: vibecheck
          POSTGRES_DB: vibecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibecheck -d vibecheck_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://vibecheck:vibecheck@127.0.0.1:5432/vibecheck_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "ruff>=0.16,<0.17" mypy

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run ruff
        working-directory: backend
        run: ruff check app tests

      - name: Run mypy
        working-directory: backend
        run: mypy app

      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short
