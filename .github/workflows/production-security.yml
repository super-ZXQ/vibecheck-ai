name: Production Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.production.txt

      - name: Audit production Python dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --progress-spinner off \
            -r requirements.production.txt

  production-containers:
    runs-on: ubuntu-latest
    needs: python-dependency-audit
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","vibecheck.example.com"]'
      BACKEND_TMPFS_SIZE: 320m

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.production.yml build

      - name: Start production stack
        run: docker compose -f docker-compose.production.yml up -d

      - name: Wait for healthy services
        shell: bash
        run: |
          for attempt in {1..60}; do
            backend_health="$(
              docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose -f docker-compose.production.yml ps -q backend)"
            )"
            frontend_health="$(
              docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose -f docker-compose.production.yml ps -q frontend)"
            )"
            if [[ "$backend_health" == "healthy" && "$frontend_health" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs
          exit 1

      - name: Verify container runtime isolation
        shell: bash
        run: |
          backend_id="$(docker compose -f docker-compose.production.yml ps -q backend)"
          frontend_id="$(docker compose -f docker-compose.production.yml ps -q frontend)"

          test "$(docker compose -f docker-compose.production.yml exec -T backend id -u)" != "0"
          test "$(docker compose -f docker-compose.production.yml exec -T frontend id -u)" != "0"
          test "$(
            docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' \
              "$backend_id"
          )" == "true"
          test "$(
            docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' \
              "$frontend_id"
          )" == "true"
          docker inspect --format='{{json .HostConfig.CapDrop}}' "$backend_id" |
            grep --fixed-strings '"ALL"'
          docker inspect --format='{{json .HostConfig.CapDrop}}' "$frontend_id" |
            grep --fixed-strings '"ALL"'
          docker inspect --format='{{json .HostConfig.SecurityOpt}}' "$backend_id" |
            grep --fixed-strings 'no-new-privileges:true'
          docker inspect --format='{{json .HostConfig.SecurityOpt}}' "$frontend_id" |
            grep --fixed-strings 'no-new-privileges:true'

          tmpfs_options="$(
            docker inspect --format='{{index .HostConfig.Tmpfs "/tmp"}}' \
              "$backend_id"
          )"
          test -n "$tmpfs_options"
          configured_bytes="$(
            python - <<'PY'
          import os
          import re

          value = os.environ["BACKEND_TMPFS_SIZE"].strip().lower()
          match = re.fullmatch(r"([1-9][0-9]*)([kmgt]?)", value)
          if match is None:
              raise SystemExit("invalid BACKEND_TMPFS_SIZE")
          multipliers = {
              "": 1,
              "k": 1024,
              "m": 1024 ** 2,
              "g": 1024 ** 3,
              "t": 1024 ** 4,
          }
          print(int(match.group(1)) * multipliers[match.group(2)])
          PY
          )"
          actual_bytes="$(
            docker compose -f docker-compose.production.yml exec -T backend \
              sh -c "df -B1 --output=size /tmp | tail -1 | tr -d ' '"
          )"
          test "$actual_bytes" -ge "$configured_bytes"
          echo "$tmpfs_options" |
            grep --fixed-strings "size=$BACKEND_TMPFS_SIZE"
          docker compose -f docker-compose.production.yml exec -T backend \
            sh -c 'probe=/tmp/vibecheck-write-test; : > "$probe"; rm "$probe"'

          data_mount="$(
            docker inspect \
              --format='{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}{{end}}{{end}}' \
              "$backend_id"
          )"
          test "$data_mount" == "volume"

      - name: Verify Trusted Host and readiness behavior
        shell: bash
        run: |
          test "$(
            curl --silent --output ready.json --write-out '%{http_code}' \
              --header 'Host: 127.0.0.1' \
              http://localhost:8000/api/ready
          )" == "200"
          grep --fixed-strings '"status":"ready"' ready.json

          test "$(
            curl --silent --output public-host.json --write-out '%{http_code}' \
              --header 'Host: vibecheck.example.com' \
              http://localhost:8000/api/health
          )" == "200"
          test "$(
            curl --silent --output untrusted-host.txt --write-out '%{http_code}' \
              --header 'Host: attacker.example.com' \
              http://localhost:8000/api/health
          )" == "400"

          if docker compose -f docker-compose.production.yml run --rm --no-deps \
            -e 'TRUSTED_HOSTS=["*"]' \
            backend python -c "import app.core.config" \
            > wildcard-host.log 2>&1; then
            echo "Wildcard Trusted Host configuration unexpectedly succeeded"
            exit 1
          fi
          grep --fixed-strings 'explicit host name' wildcard-host.log

          if docker compose -f docker-compose.production.yml run --rm --no-deps \
            -e 'TRUSTED_HOSTS=["vibecheck.example.com"]' \
            backend python -c "import app.core.config" \
            > missing-loopback.log 2>&1; then
            echo "Trusted Host configuration without loopback unexpectedly succeeded"
            exit 1
          fi
          grep --fixed-strings 'must include 127.0.0.1' missing-loopback.log

      - name: Verify restricted CORS behavior
        shell: bash
        run: |
          curl --silent --dump-header cors-allowed.txt --output /dev/null \
            --request OPTIONS \
            --header 'Origin: http://localhost:3000' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: Content-Type,Accept' \
            http://localhost:8000/api/check
          grep --ignore-case \
            '^access-control-allow-origin: http://localhost:3000' \
            cors-allowed.txt
          grep --ignore-case '^access-control-allow-methods:' cors-allowed.txt |
            grep --fixed-strings 'GET' |
            grep --fixed-strings 'POST' |
            grep --fixed-strings 'OPTIONS'
          grep --ignore-case '^access-control-allow-headers:' cors-allowed.txt |
            grep --ignore-case 'content-type' |
            grep --ignore-case 'accept'
          if grep --ignore-case '^access-control-allow-credentials:' \
            cors-allowed.txt; then
            exit 1
          fi
          if grep --ignore-case '^access-control-allow-headers:.*authorization' \
            cors-allowed.txt; then
            exit 1
          fi

          curl --silent --dump-header cors-denied.txt --output /dev/null \
            --request OPTIONS \
            --header 'Origin: https://attacker.example.com' \
            --header 'Access-Control-Request-Method: POST' \
            http://localhost:8000/api/check
          if grep --ignore-case '^access-control-allow-origin:' \
            cors-denied.txt; then
            exit 1
          fi

      - name: Verify closed documentation and desensitized errors
        shell: bash
        run: |
          for path in docs redoc openapi.json; do
            test "$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                "http://localhost:8000/$path"
            )" == "404"
          done

          test "$(
            curl --silent --output invalid-repo.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"repo_url":"not-a-public-github-url"}' \
              http://localhost:8000/api/check
          )" == "400"
          grep --fixed-strings '"error_code":"INVALID_REPO_URL"' invalid-repo.json

          test "$(
            curl --silent --output invalid-task.json --write-out '%{http_code}' \
              http://localhost:8000/api/check/not-a-task-id
          )" == "422"
          grep --fixed-strings '"error_code":"INVALID_TASK_ID"' invalid-task.json

          if grep --ignore-case --extended-regexp \
            'not-a-public-github-url|traceback|exception|credential|password|token|/app/|[A-Z]:\\' \
            invalid-repo.json invalid-task.json; then
            exit 1
          fi

      - name: Verify backend and frontend security headers
        shell: bash
        run: |
          curl --fail --silent http://localhost:3000/health |
            grep --fixed-strings '"status":"ok"'
          curl --silent --dump-header backend-headers.txt --output /dev/null \
            http://localhost:8000/api/health
          curl --silent --dump-header frontend-headers.txt --output /dev/null \
            http://localhost:3000/
          grep --ignore-case '^x-content-type-options: nosniff' backend-headers.txt
          grep --ignore-case '^x-frame-options: DENY' backend-headers.txt
          grep --ignore-case '^referrer-policy: no-referrer' backend-headers.txt
          grep --ignore-case '^permissions-policy:' backend-headers.txt
          grep --ignore-case '^strict-transport-security:' backend-headers.txt
          grep --ignore-case '^content-security-policy:' frontend-headers.txt
          grep --ignore-case '^x-content-type-options: nosniff' frontend-headers.txt
          grep --ignore-case '^x-frame-options: DENY' frontend-headers.txt
          grep --ignore-case '^referrer-policy: no-referrer' frontend-headers.txt
          grep --ignore-case '^permissions-policy:' frontend-headers.txt
          grep --ignore-case '^strict-transport-security:' frontend-headers.txt
          if grep --ignore-case '^x-powered-by:' frontend-headers.txt; then
            exit 1
          fi

      - name: Verify database volume persistence across restart
        shell: bash
        run: |
          task_id="$(
            docker compose -f docker-compose.production.yml exec -T backend \
              python -c \
              "from app.services.task_manager import create_task; print(create_task('https://github.com/octocat/Hello-World', 'octocat', 'Hello-World').id)"
          )"
          task_id="$(echo "$task_id" | tr -d '\r')"
          test -n "$task_id"
          docker compose -f docker-compose.production.yml exec -T backend \
            test -s /data/vibecheck.db

          docker compose -f docker-compose.production.yml restart backend
          for attempt in {1..30}; do
            backend_health="$(
              docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose -f docker-compose.production.yml ps -q backend)"
            )"
            if [[ "$backend_health" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          test "$backend_health" == "healthy"
          curl --fail --silent \
            --header 'Host: 127.0.0.1' \
            "http://localhost:8000/api/check/$task_id" |
            grep --fixed-strings "\"task_id\":\"$task_id\""

      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down --volumes
