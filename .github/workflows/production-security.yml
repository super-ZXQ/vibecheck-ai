name: Production Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-containers:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.production.yml build

      - name: Start production stack
        run: docker compose -f docker-compose.production.yml up -d

      - name: Wait for healthy services
        shell: bash
        run: |
          for attempt in {1..60}; do
            backend_health="$(
              docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose -f docker-compose.production.yml ps -q backend)"
            )"
            frontend_health="$(
              docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose -f docker-compose.production.yml ps -q frontend)"
            )"
            if [[ "$backend_health" == "healthy" && "$frontend_health" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs
          exit 1

      - name: Verify non-root and read-only runtime
        shell: bash
        run: |
          test "$(docker compose -f docker-compose.production.yml exec -T backend id -u)" != "0"
          test "$(docker compose -f docker-compose.production.yml exec -T frontend id -u)" != "0"
          test "$(
            docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' \
              "$(docker compose -f docker-compose.production.yml ps -q backend)"
          )" == "true"
          test "$(
            docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' \
              "$(docker compose -f docker-compose.production.yml ps -q frontend)"
          )" == "true"

      - name: Verify readiness and security headers
        shell: bash
        run: |
          curl --fail --silent http://localhost:8000/api/ready |
            grep --fixed-strings '"status":"ready"'
          curl --fail --silent http://localhost:3000/health |
            grep --fixed-strings '"status":"ok"'
          curl --silent --dump-header backend-headers.txt --output /dev/null \
            http://localhost:8000/api/health
          curl --silent --dump-header frontend-headers.txt --output /dev/null \
            http://localhost:3000/
          grep --ignore-case '^x-content-type-options: nosniff' backend-headers.txt
          grep --ignore-case '^x-frame-options: DENY' backend-headers.txt
          grep --ignore-case '^strict-transport-security:' backend-headers.txt
          grep --ignore-case '^content-security-policy:' frontend-headers.txt
          grep --ignore-case '^x-content-type-options: nosniff' frontend-headers.txt
          grep --ignore-case '^strict-transport-security:' frontend-headers.txt
          if grep --ignore-case '^x-powered-by:' frontend-headers.txt; then
            exit 1
          fi

      - name: Show production logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down --volumes
